<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login · Event Ticketing Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>🎫 Event Ticketing Portal</h1>
      <p class="subtitle">Sign in to manage your events</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="admin@gmail.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary btn-full" id="loginBtn">Sign In</button>
        <p id="errorMsg" class="error-msg hidden"></p>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (getToken()) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      err.classList.add('hidden');

      try {
        await login(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        window.location.href = 'dashboard.html';
      } catch (e) {
        err.textContent = e.message || 'Login failed';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
